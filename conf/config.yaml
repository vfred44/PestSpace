defaults:
  #- model: Resnet18
  - model: EfficientnetB0

#ckpt_path: '/Users/fredvaartnou/VSCODE/PestSpace/Checkpoints/19.01.2026/epoch=24-val_loss=0.0471.ckpt'

trainer:
  max_epochs: 25
  accelerator: gpu
  devices: 1

learning_rate: 0.0003
weight_decay: 0.0001

#----------------------------------------------------------------------------------------------------------------#

wandb:
  project: "PestSpace"
  entity: "fred-vaartnou-ut"
  run_name: "EfficientnetB0_soy_1"


#----------------------------------------------------------------------------------------------------------------#

data:
  #train_base: "/gpfs/helios/home/fred87/Images/Vicia_faba"
  train_base: "/gpfs/helios/home/fred87/Images/Glycine_max"
  #train_base: "/Users/fredvaartnou/Library/CloudStorage/OneDrive-TartuÜlikool/PestSpace/Images/Vicia_faba"
  #train_base: "/Users/fredvaartnou/Desktop/Taimehaigused ML/Data/Auburn_soybean_disease_image_dataset_(ASDID)"

  num_classes: 8

  classes_to_use:
    # - Downy_mildew
    # - Chocolate_spot
    # - Soy_rust
    - bacterial_blight
    - cercospora_leaf_blight
    - downey_mildew
    - frogeye
    - healthy
    - potassium_deficiency
    - soybean_rust
    - target_spot

  class_to_label:
    # Downy_mildew: 0
    # Chocolate_spot: 1
    # Soy_rust: 2

    bacterial_blight: 0
    cercospora_leaf_blight: 1
    downey_mildew: 2
    frogeye: 3
    healthy: 4
    potassium_deficiency: 5
    soybean_rust: 6
    target_spot: 7
  
  batch_size: 32
  num_workers: 4

  transforms:
    train:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: torchvision.transforms.RandomResizedCrop
          size: 320
          scale: [0.5, 1.0]
        - _target_: torchvision.transforms.RandomHorizontalFlip
        - _target_: torchvision.transforms.RandomVerticalFlip
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.3
          contrast: 0.3
          saturation: 0.3
          hue: 0.05
        - _target_: torchvision.transforms.ToTensor
        - _target_: torchvision.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std:  [0.229, 0.224, 0.225]

    val:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: torchvision.transforms.Resize
          size: 360
        - _target_: torchvision.transforms.CenterCrop
          size: 320
        - _target_: torchvision.transforms.ToTensor
        - _target_: torchvision.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std:  [0.229, 0.224, 0.225]

  
  use_weightedrandomsampler: true

#----------------------------------------------------------------------------------------------------------------#

loss_function:
  use_focal_loss: false
  gamma: 2

  use_weighted_loss: false
