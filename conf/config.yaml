defaults:
  - model: Resnet18
  #- model: EfficientnetB0
  #- model: multiEfficientnetB0

#ckpt_path: '/Users/fredvaartnou/Desktop/Taimehaigused ML/Saadetud mudelid/Model_vicia faba_090326/checkpoints (9.03.26)/epoch=7-val_loss=0.1114.ckpt'

trainer:
  max_epochs: 25
  accelerator: gpu
  devices: 1

learning_rate: 0.0003
weight_decay: 0.0001

#----------------------------------------------------------------------------------------------------------------#

wandb:
  project: "PestSpace"
  entity: "fred-vaartnou-ut"
  run_name: "Resnet18_soy_imagenet1k"


#----------------------------------------------------------------------------------------------------------------#

data:
  #train_base: "/gpfs/helios/home/fred87/Images/Vicia_faba"
  train_base: "/gpfs/helios/home/fred87/Images/Soy_wheat_faba"
  #train_base: "/Users/fredvaartnou/Desktop/Taimehaigused ML/Data/Soy_wheat"
  #train_base: "/Users/fredvaartnou/Library/CloudStorage/OneDrive-TartuÜlikool/PestSpace/Images/Vicia_faba"
  #train_base: "/Users/fredvaartnou/Desktop/Taimehaigused ML/Data/Auburn_soybean_disease_image_dataset_(ASDID)"

  # plants_to_use:
  #   - Soybean
  #   #- Wheat
  #   #- Fababean

  # plants_to_label:
  #   Soybean: 0
  #   #Wheat: 0
  #   #Fababean: 1

  diseases_to_use:
    - Soybean_cercospora_leaf_blight
    - Soybean_downey_mildew
    - Soybean_frogeye
    - Soybean_healthy
    - Soybean_rust
    - Soybean_target_spot
    # - Soybean_bacterial_blight
    # - Soybean_potassium_deficiency
    # - Wheat_brown_rust
    # - Wheat_healthy
    # - Wheat_septoria
    # - Wheat_yellow_rust
    # - Fababean_chocolate_spot
    # - Fababean_downy_mildew

  diseases_to_label:
    Soybean_cercospora_leaf_blight: 0
    Soybean_downey_mildew: 1
    Soybean_frogeye: 2
    Soybean_healthy: 3
    Soybean_rust: 4
    Soybean_target_spot: 5
    # Soybean_bacterial_blight: 6
    # Soybean_potassium_deficiency: 7
    # Wheat_brown_rust: 8
    # Wheat_healthy: 9
    # Wheat_septoria: 10
    # Wheat_yellow_rust: 11
    # Fababean_chocolate_spot: 12
    # Fababean_downy_mildew: 13
  
  batch_size: 32
  num_workers: 4

  transforms:
    train:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: torchvision.transforms.RandomResizedCrop
          size: 320
          scale: [0.5, 1.0]
        # - _target_: torchvision.transforms.Resize
        #   size: [320, 320]
        - _target_: torchvision.transforms.RandomHorizontalFlip
        - _target_: torchvision.transforms.RandomVerticalFlip
        - _target_: torchvision.transforms.ColorJitter
          brightness: 0.3
          contrast: 0.3
          saturation: 0.3
          hue: 0.05
        - _target_: torchvision.transforms.ToTensor
        - _target_: torchvision.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std:  [0.229, 0.224, 0.225]

    val:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: torchvision.transforms.Resize
          size: 320
        - _target_: torchvision.transforms.CenterCrop
          size: 320
        - _target_: torchvision.transforms.ToTensor
        - _target_: torchvision.transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std:  [0.229, 0.224, 0.225]

  
  use_weightedrandomsampler: true

#----------------------------------------------------------------------------------------------------------------#

loss_function:
  use_focal_loss: false
  gamma: 2

  use_weighted_loss: false
